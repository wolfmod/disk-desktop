# Диск Ра Град: настройки Craft для сборки установщика Windows в GitHub Actions (ragrad-windows.yml).
# Отличия от craft_override.ini апстрима: наш рецепт ragrad/disk-desktop (admin/craft), без ccache и без подписи SignPath.
[GeneralSettings]
# создавать кэш пакетов на GitHub смысла нет, готовые библиотеки берутся из кэша Craft
Packager/CreateCache = False
Packager/UseCache = True
Compile/UseCCache = False
# наше хранилище рецептов: ragrad/disk-desktop (название, установщик NSIS)
Blueprints/Locations = ${Env:GITHUB_WORKSPACE}/admin/craft

[windows-cl-msvc2022-x86_64]
# короткие пути (длинные пути на Windows ломают сборку Qt)
ShortPath/JunctionDir = ${Env:SYSTEMDRIVE}/_
